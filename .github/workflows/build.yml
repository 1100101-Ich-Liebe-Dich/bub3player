name: Bauen

# Every push to main and every pull request builds the AppImage and tries it
# out (start, screenshot, audio analysis through the bundled GStreamer).
# Publishing a release in the GitHub UI attaches the AppImage to it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    # The oldest supported Ubuntu: the AppImage runs on systems with this glibc
    # (2.35) or newer, i.e. Ubuntu 22.04, Debian 12, Fedora 36, Mint 21 and up.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          dist/appimage/ci-run.sh "Pakete" sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf file xvfb xauth \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-alsa glib-networking \
            libtag1-dev libsqlite3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true

      - name: AppImage bauen
        run: dist/appimage/ci-run.sh "AppImage bauen" dist/appimage/build-appimage.sh

      - name: Ausprobieren
        working-directory: build-appimage
        run: |
          ./BuB3Player-x86_64.AppImage --appimage-extract > /dev/null
          export XDG_CONFIG_HOME=$PWD/t/cfg XDG_DATA_HOME=$PWD/t/data XDG_CACHE_HOME=$PWD/t/cache
          run=../dist/appimage/ci-run.sh
          $run "Hilfe" env QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --help
          # a 3 s test tone, analysed through the bundled GStreamer
          python3 -c "import wave,math,struct; w=wave.open('ton.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',*(2*[int(9000*math.sin(2*math.pi*440*i/44100))])) for i in range(44100*3))); w.close()"
          $run "Audioanalyse" ./squashfs-root/AppRun --analyze ton.wav | tee analyse.txt
          grep -q "LUFS" analyse.txt
          $run "Start" xvfb-run -a -s "-screen 0 1380x880x24" ./squashfs-root/AppRun --no-scan --screenshot start.png --screenshot-delay 5000
          test -s start.png

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BuB3Player-AppImage
          path: |
            build-appimage/BuB3Player-x86_64.AppImage
            build-appimage/start.png
          retention-days: 14

      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build-appimage/BuB3Player-x86_64.AppImage --clobber
