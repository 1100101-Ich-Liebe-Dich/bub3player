name: Bauen

# Every push to main and every pull request builds the AppImage and tries it
# out (start, screenshot, audio analysis through the bundled GStreamer).
# Publishing a release in the GitHub UI attaches the AppImage to it, together
# with the source code of the Ubuntu packages inside (GPL/LGPL).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage
    # The oldest supported Ubuntu: the AppImage runs on systems with this glibc
    # (2.35) or newer, i.e. Ubuntu 22.04, Debian 12, Fedora 36, Mint 21 and up.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          # the runner image ships libunwind-14-dev, which blocks libgstreamer1.0-dev
          sudo apt-get remove -y libunwind-14-dev || true
          dist/appimage/ci-run.sh "Pakete" sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf file xvfb xauth \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-alsa glib-networking \
            libtag1-dev libsqlite3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
          cache: true

      - name: AppImage bauen
        run: dist/appimage/ci-run.sh "AppImage bauen" dist/appimage/build-appimage.sh

      - name: Ausprobieren
        working-directory: build-appimage
        run: ../dist/appimage/ci-run.sh "Ausprobieren" ../dist/appimage/smoke-test.sh BuB3Player-x86_64.AppImage

      - name: Hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BuB3Player-AppImage
          path: |
            build-appimage/BuB3Player-x86_64.AppImage
            build-appimage/quellpakete.txt
            build-appimage/*.png
          retention-days: 14

  release:
    name: Release
    if: github.event_name == 'release'
    needs: appimage
    # same Ubuntu as the build: the source packages in exactly the bundled versions
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: BuB3Player-AppImage

      - name: Quellcode der mitgelieferten Pakete
        run: |
          grep -h '^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null \
            | grep -i ubuntu | sed 's/^deb /deb-src /' | sudo tee /etc/apt/sources.list.d/quellen.list > /dev/null
          sudo apt-get update -qq
          tag="${{ github.event.release.tag_name }}"
          dir="BuB3Player-${tag#v}-quellen"
          mkdir -p "$dir" && cd "$dir"
          : > FEHLT.txt
          while read -r spec; do
            apt-get source --download-only "$spec" > /dev/null 2>&1 || echo "$spec" >> FEHLT.txt
          done < ../quellpakete.txt
          cp ../quellpakete.txt .
          printf '%s\n' "Quellcode der Ubuntu-Pakete im AppImage von BuB3Player $tag, genau in den mitgelieferten Versionen (quellpakete.txt)." \
            "Auspacken eines Pakets: dpkg-source -x PAKET_VERSION.dsc" \
            "Qt: https://download.qt.io/archive/qt/ (Version in usr/share/licenses/bub3player/MITGELIEFERT.txt im AppImage)." \
            "Nicht mehr im Archiv (siehe Launchpad): FEHLT.txt" > LIESMICH.txt
          cd .. && tar -cf "$dir.tar" "$dir"
          ls -l "$dir.tar"; cat "$dir/FEHLT.txt"

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" BuB3Player-x86_64.AppImage "BuB3Player-${tag#v}-quellen.tar" --clobber --repo "${{ github.repository }}"
